name: flutter_workoutkit
description: "Create, preview, validate and schedule custom workouts for the Apple Watch Workout app using Apple's WorkoutKit."
version: 0.1.0
homepage: https://adamkramer.dev
repository: https://github.com/adamk22/flutter-workoutkit
issue_tracker: https://github.com/adamk22/flutter-workoutkit/issues
topics: [workoutkit, apple-watch, healthkit, fitness, workouts]
funding: [https://github.com/sponsors/adamk22]

environment:
  sdk: ^3.5.4
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: WorkoutkitPlugin
