name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Analyze & Dart tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: flutter pub publish --dry-run

  ios:
    name: iOS ${{ matrix.ios }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 17.5 exercises the iOS 17 fallbacks (no step names or pool swim
        # goals) on a real runtime; 18.6 is the oldest with every feature.
        ios: ['17.5', '18.6', 'latest']
    defaults:
      run:
        # Flutter's SwiftPM integration for plugin example apps requires the
        # plugin directory to be named like the plugin.
        working-directory: flutter_workoutkit
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter_workoutkit
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create an iOS ${{ matrix.ios }} simulator
        env:
          IOS: ${{ matrix.ios }}
        run: |
          runtime() {
            xcrun simctl list -j runtimes | python3 -c '
          import json, sys
          want = sys.argv[1]
          rts = [r for r in json.load(sys.stdin)["runtimes"]
                 if r["isAvailable"] and ".iOS-" in r["identifier"]]
          key = lambda r: [int(p) for p in r["version"].split(".")]
          rts = rts if want == "latest" else [r for r in rts if r["version"] == want or r["version"].startswith(want + ".")]
          print(sorted(rts, key=key)[-1]["identifier"] if rts else "")
          ' "$IOS"
          }
          RUNTIME=$(runtime)
          if [ -z "$RUNTIME" ]; then
            sudo xcodebuild -downloadPlatform iOS -buildVersion "$IOS"
            RUNTIME=$(runtime)
          fi
          echo "Runtime: $RUNTIME"
          SIM=$(xcrun simctl create "CI iPhone" "iPhone 15" "$RUNTIME")
          xcrun simctl boot "$SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"
      - name: Swift unit tests (RunnerTests)
        run: tool/ios_test.sh "$SIM"
      - name: Integration tests
        if: matrix.ios == 'latest'
        working-directory: flutter_workoutkit/example
        run: flutter test integration_test -d "$SIM"
      - name: CocoaPods podspec lint
        if: matrix.ios == 'latest'
        run: pod lib lint ios/flutter_workoutkit.podspec --configuration=Debug --skip-tests --use-modular-headers --use-libraries
